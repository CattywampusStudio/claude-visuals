<svg width="1600" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><defs><filter id="goo" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2000" height="1400" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="34" result="b"/><feGaussianBlur in="SourceAlpha" stdDeviation="34" result="a"/><feComposite in="a" in2="a" operator="arithmetic" k1="0" k2="24" k3="0" k4="-10" result="m"/><feComposite in="b" in2="m" operator="in" result="c"/><feMerge result="s"><feMergeNode in="c"/><feMergeNode in="c"/><feMergeNode in="c"/><feMergeNode in="c"/></feMerge><feGaussianBlur in="s" stdDeviation="8"/></filter><radialGradient id="glow" cx="50%" cy="100%" r="80%"><stop class="s2" offset="0" stop-opacity=".55"/><stop class="s2" offset="1" stop-opacity="0"/></radialGradient></defs><style>svg{--ground:#07070A;--w0:#A6F21A;--w1:#1EC8FF;--w2:#B44CFF;--w3:#FF3B5C;--wax:0.7}@media (prefers-color-scheme:light){svg{--ground:#F4F1E8;--w0:#4E8F00;--w1:#0A84C4;--w2:#8A2BD6;--w3:#D4143A;--wax:0.5}}.ground{fill:var(--ground)}.c0{fill:var(--w0)}.s0{stop-color:var(--w0)}.c1{fill:var(--w1)}.s1{stop-color:var(--w1)}.c2{fill:var(--w2)}.s2{stop-color:var(--w2)}.c3{fill:var(--w3)}.s3{stop-color:var(--w3)}.wax{opacity:var(--wax)}.b{transform-box:fill-box;transform-origin:50% 50%}.b{animation:float 40s ease-in-out infinite alternate}@keyframes float{0%{transform:translate(0,0) scale(1,1)}40%{transform:translate(var(--dx),calc(var(--dy)*.4)) scale(.86,1.2)}75%{transform:translate(calc(var(--dx)*-1),calc(var(--dy)*.75)) scale(.93,1.1)}100%{transform:translate(0,var(--dy)) scale(1.06,.92)}}.glow{animation:breathe 11s ease-in-out infinite alternate}@keyframes breathe{from{opacity:.45}to{opacity:.85}}@media (prefers-reduced-motion:reduce){.b,.glow{animation:none}}</style><rect class="ground" x="-400" y="-400" width="2400" height="1800"/><rect class="glow" x="-400" y="400" width="2400" height="1000" fill="url(#glow)